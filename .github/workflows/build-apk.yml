name: Gold AI APK Builder

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Gold AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare App Files
        run: |
          mkdir -p www assets
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='www' \
            --exclude='android' \
            --exclude='node_modules' \
            ./ www/

          cp icon.png assets/icon.png

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install --save-dev @capacitor/assets

      - name: Configure Android
        run: |
          npx cap init "Gold AI" "com.goldai.app" --web-dir www
          npx cap add android

      - name: Generate App Icon
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#080D2B' \
            --splashBackgroundColor '#080D2B'

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gold-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
